# Sync (ORCID + experiment mirroring) proxy for pinpoint.allenneuraldynamics.org
#
# Installed on the deployment server as
# /etc/apache2/conf-available/pinpoint-sync.conf, then enabled with
# `sudo a2enmod proxy proxy_http headers && sudo a2enconf pinpoint-sync \
#  && sudo systemctl reload apache2`.
#
# The Pinpoint V sync feature talks to the aind-metadata-viz service, which
# authenticates with an ORCID session cookie. That cookie is only sent on
# first-party requests, so the service is mounted on this host's own origin at
# /metadata-viz and forwarded from here, exactly as the data portal's nginx
# does. The app never makes a cross-origin request and no CORS grant is needed.
#
# The service's ORCID callback runs on its own PUBLIC_BASE_URL host, so the
# service must also be configured with
# SESSION_COOKIE_DOMAIN=.allenneuraldynamics.org for the session it sets to be
# readable through this proxy.

<IfModule mod_proxy.c>
  SSLProxyEngine On

  # Scoped to this path: TLS terminates at the load balancer, so upstream needs
  # telling the original scheme, but overriding X-Forwarded-Proto globally would
  # defeat the http -> https redirect vhosts.
  <Location /metadata-viz/>
    ProxyPass        https://metadata-portal.allenneuraldynamics.org/
    ProxyPassReverse https://metadata-portal.allenneuraldynamics.org/
    RequestHeader set X-Forwarded-Proto "https"
  </Location>
</IfModule>
