name: Build

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      upload-artifact:
        description: "Upload the built app as a workflow artifact for deployment"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🟨 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔨 Build app
        run: pnpm build

      - name: 📖 Build docs
        run: pnpm docs:build

      - name: 🔗 Merge docs into app build
        run: cp -r docs/.vitepress/dist dist/spa/docs

      - name: ⬆️ Upload artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spa
          path: "dist/spa"
          include-hidden-files: true
