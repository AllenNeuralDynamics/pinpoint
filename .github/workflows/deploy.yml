name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  deploy:
    name: Deploy

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://pinpoint.allenneuraldynamics.org/v5/

    needs: build

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ⬇️ Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: spa
          path: dist/spa

      - name: 🔑 Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts

      - name: 🚀 Deploy app
        env:
          SSH_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          rsync -rlptDz --delete \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            dist/spa/ "$SSH_TARGET:/var/www/html/v5/"

      - name: 🚀 Deploy landing page
        env:
          SSH_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          rsync -rlptDz \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            deploy/landing/index.html "$SSH_TARGET:/var/www/html/index.html"
