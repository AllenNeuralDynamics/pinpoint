# Cache policy for pinpoint.allenneuraldynamics.org
#
# Installed manually on the deployment server as
# /etc/apache2/conf-available/pinpoint-cache.conf, then enabled with
# `sudo a2enconf pinpoint-cache && sudo systemctl reload apache2`.
# Requires mod_expires, mod_headers, and mod_deflate.
#
# The Pinpoint V build (/v5) emits ~600 content-hashed chunks, so a cold load is
# request-heavy. Hashed assets are immutable and cached for a year; the SPA shell
# and the landing page must never be cached or clients pin to a stale build.

<IfModule mod_expires.c>
  ExpiresActive On
</IfModule>

<Directory /var/www/html/v5>
  <FilesMatch "-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|wasm)$">
    Header always set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>

  <FilesMatch "^(index\.html|manifest\.json|service-worker\.js)$">
    Header always set Cache-Control "no-cache"
  </FilesMatch>
</Directory>

<Directory /var/www/html>
  <Files "index.html">
    Header always set Cache-Control "no-cache"
  </Files>
</Directory>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain text/javascript application/javascript application/json image/svg+xml
</IfModule>
