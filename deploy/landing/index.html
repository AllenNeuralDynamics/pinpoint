<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinpoint</title>
    <meta
      name="description"
      content="Pinpoint: in vivo electrophysiology planning and automation. Choose the Pinpoint V beta or continue with Pinpoint v2."
    />
    <link rel="icon" href="/v2/TemplateData/favicon.ico" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0f1115;
        --fg: #f2f4f8;
        --muted: #a6adbb;
        --card: #171a21;
        --border: #2a2f3a;
        --accent: #4f8cff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --fg: #14161a;
          --muted: #5b6472;
          --card: #ffffff;
          --border: #dfe3e9;
          --accent: #1b6ef3;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        letter-spacing: -0.02em;
      }

      p.tagline {
        margin: 0 0 2rem;
        color: var(--muted);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      a.option {
        display: block;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: inherit;
        text-align: left;
        text-decoration: none;
        transition:
          border-color 120ms ease,
          transform 120ms ease;
      }

      a.option:hover {
        border-color: var(--accent);
      }

      a.option:active {
        transform: translateY(1px);
      }

      a.option:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        a.option {
          transition: none;
        }

        a.option:active {
          transform: none;
        }
      }

      .option strong {
        display: block;
        font-size: 1.125rem;
      }

      .option .desc {
        color: var(--muted);
        font-size: 0.9375rem;
      }

      .option .badge {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 600;
        vertical-align: 2px;
      }

      footer {
        margin-top: 2rem;
        color: var(--muted);
        font-size: 0.875rem;
      }

      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pinpoint</h1>
      <p class="tagline">In vivo electrophysiology planning and automation.</p>

      <ul>
        <li>
          <a class="option" href="/v5/">
            <strong>Pinpoint V <span class="badge">Beta</span></strong>
            <span class="desc">Help us debug the next generation of stereotaxic planning tools.</span>
          </a>
        </li>
        <li>
          <a class="option" href="/v2/">
            <strong>Pinpoint v2</strong>
            <span class="desc">Last stable Unity release.</span>
          </a>
        </li>
      </ul>

      <footer>
        <a href="https://github.com/AllenNeuralDynamics/pinpoint">Source</a>
        &middot;
        <a href="/v5/docs/">Documentation</a>
      </footer>
    </main>
  </body>
</html>
